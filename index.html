<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Steam Share Master - SSM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="button-group">
            <button id="block-btn">断开 Steam 网络</button>
            <button id="unblock-btn">恢复 Steam 网络</button>
        </div>

        <button id="select-path-btn">选择 Steam 程序位置（可选）</button>

        <div id="path-label-container">
            <p id="path-label">当前路径：C:\...</p>
        </div>

        <div id="log-display"></div>

        <div class="footer">
            <p>© 2025 p4ul-t. 遵循 GPL-3.0 许可协议。 Steam Share Master (SSM) v0.1.4</p>
            <p>SSM 与 Steam 无关联。Steam 是 Valve Corporation 的商标。</p>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
